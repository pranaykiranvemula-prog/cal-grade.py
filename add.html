<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Student</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #F0F4F8; color: #2D3748;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, #1565C0, #0D47A1);
      color: white; padding: 16px 32px;
      display: flex; align-items: center; gap: 16px;
    }
    header a {
      color: white; text-decoration: none;
      font-size: 20px; line-height: 1;
    }
    header h1 { font-size: 18px; }

    .container {
      max-width: 560px; margin: 40px auto;
      background: white; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .form-header {
      background: #EBF4FF; padding: 20px 28px;
      border-bottom: 1px solid #DBEAFE;
    }
    .form-header h2 { font-size: 17px; color: #1565C0; }
    .form-header p  { font-size: 13px; color: #718096; margin-top: 4px; }

    form { padding: 28px; }

    .form-group { margin-bottom: 18px; }
    label {
      display: block; font-size: 13px;
      font-weight: 600; color: #4A5568;
      margin-bottom: 6px;
    }
    input[type="text"], input[type="number"] {
      width: 100%; padding: 10px 14px;
      border: 1.5px solid #CBD5E0;
      border-radius: 6px; font-size: 14px;
      transition: border 0.2s; color: #2D3748;
    }
    input:focus {
      outline: none; border-color: #1565C0;
      box-shadow: 0 0 0 3px rgba(21,101,192,0.1);
    }
    .marks-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .hint {
      font-size: 11px; color: #A0AEC0; margin-top: 4px;
    }
    .error-box {
      background: #FFEBEE; border: 1px solid #FC8181;
      color: #C62828; padding: 12px 16px;
      border-radius: 6px; font-size: 13px;
      margin-bottom: 20px;
    }
    .btn-row {
      display: flex; gap: 12px; margin-top: 24px;
    }
    .btn-submit {
      flex: 1; background: #1565C0; color: white;
      border: none; padding: 12px;
      border-radius: 6px; font-size: 15px;
      font-weight: 700; cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: #0D47A1; }
    .btn-cancel {
      flex: 1; background: white; color: #4A5568;
      border: 1.5px solid #CBD5E0; padding: 12px;
      border-radius: 6px; font-size: 15px;
      font-weight: 600; text-decoration: none;
      text-align: center; transition: background 0.2s;
    }
    .btn-cancel:hover { background: #F7FAFC; }
  </style>
</head>
<body>

<header>
  <a href="/">&#8592;</a>
  <h1>Add New Student</h1>
</header>

<div class="container">
  <div class="form-header">
    <h2>Enter Student Details</h2>
    <p>Fill in the student name and marks for all 5 subjects (0 to 100)</p>
  </div>

  <form method="POST" action="/add">

    {% if error %}
    <div class="error-box">{{ error }}</div>
    {% endif %}

    <div class="form-group">
      <label for="name">Student Name</label>
      <input type="text" id="name" name="name"
             placeholder="e.g. Ramesh Kumar" required/>
    </div>

    <div class="form-group">
      <label>Subject Marks <span class="hint">(enter marks out of 100)</span></label>
      <div class="marks-grid">
        <div>
          <label for="maths">Maths</label>
          <input type="number" id="maths" name="maths"
                 min="0" max="100" placeholder="0-100" required/>
        </div>
        <div>
          <label for="science">Science</label>
          <input type="number" id="science" name="science"
                 min="0" max="100" placeholder="0-100" required/>
        </div>
        <div>
          <label for="english">English</label>
          <input type="number" id="english" name="english"
                 min="0" max="100" placeholder="0-100" required/>
        </div>
        <div>
          <label for="telugu">Telugu</label>
          <input type="number" id="telugu" name="telugu"
                 min="0" max="100" placeholder="0-100" required/>
        </div>
        <div>
          <label for="hindi">Hindi</label>
          <input type="number" id="hindi" name="hindi"
                 min="0" max="100" placeholder="0-100" required/>
        </div>
      </div>
    </div>

    <div class="btn-row">
      <a href="/" class="btn-cancel">Cancel</a>
      <button type="submit" class="btn-submit">Add Student</button>
    </div>

  </form>
</div>

</body>
</html>
